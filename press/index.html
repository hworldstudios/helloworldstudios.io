<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>BELTFED Press Kit</title>
    <meta
      name="description"
      content="Press kit for BELTFED, a roguelike factory defense game by Hello World Studios. Fact sheet, screenshots, logos, key art and contact details for press and creators."
    />
    <meta name="theme-color" content="#0c0c0e" />
    <link
      rel="icon"
      type="image/png"
      href="../assets/favicon-light-theme.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="../assets/favicon-dark-theme.png"
      media="(prefers-color-scheme: dark)"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hello World Studios" />
    <meta property="og:title" content="BELTFED Press Kit" />
    <meta
      property="og:description"
      content="Press kit for BELTFED, a roguelike factory defense game by Hello World Studios."
    />
    <meta
      property="og:image"
      content="https://helloworldstudios.io/press/thumbs/key-art/beltfed-key-art.jpg"
    />
    <meta property="og:url" content="https://helloworldstudios.io/press/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BELTFED Press Kit" />
    <meta
      name="twitter:description"
      content="Press kit for BELTFED, a roguelike factory defense game by Hello World Studios."
    />
    <meta
      name="twitter:image"
      content="https://helloworldstudios.io/press/thumbs/key-art/beltfed-key-art.jpg"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <script>
      /*
       * The page is assembled at runtime from two places:
       *   - the copy comes from presskit.md (sits outside press-kit/, so it
       *     never lands in the ZIP; build-zip.py renders it into
       *     press-kit/presskit.html for the download, so the two cannot drift)
       *   - the galleries are the files in press-kit/[folder]/
       * So the update loop is: edit press-kit/, re-zip it, done.
       */
      const CONFIG = {
        // Source of truth for all page copy. Lives outside press-kit/ so it
        // stays out of the ZIP; build-zip.py renders it to presskit.html there.
        markdown: "presskit.md",
        // Zip of press-kit/ - right-click the folder, "Compress to ZIP file",
        // and Windows names it exactly this.
        zip: "press-kit.zip",
        // Filename journalists get when they click download.
        zipDownloadName: "beltfed-press-kit.zip",
        // Video is deliberately kept out of the ZIP. Put the Google Drive
        // folder holding the trailer and gameplay downloads here; while it is
        // empty the "Download videos" button jumps to the Video section, where
        // the individual links live.
        videos: "",
        // Google Drive folder journalists can browse instead of downloading.
        drive:
          "https://drive.google.com/drive/folders/11YrkhNBw6QvSOOmjAsjG5kxojSsHngpa",
        // Live folder listings come from the GitHub contents API, so any file
        // dropped into press-kit/[folder]/ shows up here with no HTML edit.
        repo: "hworldstudios/helloworldstudios.io",
        branch: "main",
      };
    </script>

    <style>
      :root {
        --bg: #0c0c0e;
        --bg-alt: #131316;
        --surface: #1b1b1f;
        --text: #f4f4f2;
        --muted: #a0a0a4;
        /* BELTFED orange, matching beltfedgame.com. The studio blue stays on
           the rest of helloworldstudios.io; this page is the game's. */
        --accent: #ff7a18;
        --accent-2: #ffb347;
        --accent-ink: #1a1205;
        --accent-glow: rgba(255, 122, 24, 0.35);
        --accent-glow-strong: rgba(255, 122, 24, 0.5);
        /* Body links only: the lighter orange reads better at text size than
           --accent does, without lightening buttons or nav pills. */
        --link: #ffb347;
        /* Placeholders must not read as brand colour, so they sit well away
           from the orange on the wheel. */
        --todo: #ff4d9d;
        --todo-bg: rgba(255, 77, 157, 0.08);
        --border: #2a2a30;
        --radius: 12px;
        --maxw: 1100px;
        --header-h: 68px;
        --subnav-h: 48px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a {
        color: var(--link);
      }

      img {
        display: block;
        max-width: 100%;
      }

      code {
        padding: 0.1em 0.35em;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 0.88em;
      }

      .inner {
        max-width: var(--maxw);
        margin: 0 auto;
      }

      /* ---------- header ---------- */

      .site-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: var(--header-h);
        z-index: 1000;
        display: flex;
        align-items: center;
        background: rgba(12, 12, 14, 0.72);
        backdrop-filter: saturate(140%) blur(12px);
        -webkit-backdrop-filter: saturate(140%) blur(12px);
        border-bottom: 1px solid var(--border);
      }
      .site-header__inner {
        width: 100%;
        max-width: var(--maxw);
        margin: 0 auto;
        padding: 0 1.25rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .brand {
        font-family: "Montserrat", sans-serif;
        font-weight: 300;
        font-size: clamp(0.7rem, 2.4vw, 0.95rem);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--text);
        white-space: nowrap;
        padding-left: 0.35em;
        transition: color 0.15s ease;
      }
      .brand:hover {
        color: #fff;
      }
      .header__actions {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .back {
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--muted);
        transition: color 0.15s ease;
      }
      .back:hover {
        color: var(--text);
      }

      /* ---------- section nav ---------- */

      .subnav {
        position: sticky;
        top: var(--header-h);
        z-index: 900;
        background: rgba(19, 19, 22, 0.92);
        backdrop-filter: saturate(140%) blur(12px);
        -webkit-backdrop-filter: saturate(140%) blur(12px);
        border-bottom: 1px solid var(--border);
      }
      .subnav__inner {
        max-width: var(--maxw);
        margin: 0 auto;
        padding: 0 1.25rem;
        height: var(--subnav-h);
        display: flex;
        align-items: center;
        gap: 0.25rem;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .subnav__inner::-webkit-scrollbar {
        display: none;
      }
      .subnav a {
        flex: none;
        padding: 0.35rem 0.65rem;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--muted);
        white-space: nowrap;
        transition:
          color 0.15s ease,
          background 0.15s ease;
      }
      .subnav a:hover,
      .subnav a:focus-visible {
        color: var(--text);
        background: rgba(255, 255, 255, 0.05);
      }
      .subnav a.is-active {
        color: var(--accent-ink);
        background: var(--accent);
      }

      /* ---------- buttons ---------- */

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        min-height: 46px;
        padding: 0.6rem 1.3rem;
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: var(--radius);
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          filter 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }
      .btn-primary {
        color: var(--accent-ink);
        background: linear-gradient(180deg, var(--accent-2), var(--accent));
        border: none;
        box-shadow: 0 8px 24px var(--accent-glow);
      }
      .btn-primary:hover,
      .btn-primary:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px var(--accent-glow-strong);
        filter: brightness(1.05);
      }
      .btn-ghost {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover,
      .btn-ghost:focus-visible {
        transform: translateY(-2px);
        border-color: var(--accent);
        color: #fff;
      }
      .btn .ico {
        width: 20px;
        height: 20px;
        flex: none;
      }
      .btn__meta {
        font-weight: 600;
        opacity: 0.75;
        letter-spacing: 0.02em;
        text-transform: none;
      }
      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .btn-sm {
        min-height: 36px;
        padding: 0.35rem 0.9rem;
        font-size: 0.72rem;
        letter-spacing: 0.1em;
      }

      /* ---------- hero ---------- */

      .hero {
        position: relative;
        margin-top: var(--header-h);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: clamp(3.5rem, 10vw, 6rem) 1.25rem clamp(3rem, 8vw, 4.5rem);
        background:
          linear-gradient(
            180deg,
            rgba(12, 12, 14, 0.55) 0%,
            rgba(12, 12, 14, 0.65) 55%,
            rgba(12, 12, 14, 0.97) 100%
          ),
          url("../assets/beltfed-bg.jpg") center / cover no-repeat;
      }
      .hero__eyebrow {
        margin: 0 0 clamp(1.25rem, 3vw, 1.75rem);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .hero__logo {
        width: min(520px, 82vw);
        height: auto;
        margin: 0 auto clamp(1rem, 3vw, 1.5rem);
        filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.6));
      }
      .hero__tagline {
        margin: 0 0 0.35rem;
        font-size: clamp(1.1rem, 3vw, 1.5rem);
        font-weight: 800;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      .hero__genre {
        margin: 0 0 clamp(1.75rem, 4vw, 2.25rem);
        font-size: clamp(0.85rem, 2.2vw, 1rem);
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .hero .btn-row {
        justify-content: center;
      }

      /* ---------- two-column bands ---------- */

      /*
       * A pair of sections rendered side by side on wide screens. The wrapper
       * owns the band chrome (padding, rule, background) so the two sections
       * inside it drop their own and just become grid columns. Below 900px the
       * grid collapses and they stack in document order.
       */
      .split__inner {
        max-width: var(--maxw);
        margin: 0 auto;
        display: grid;
        gap: clamp(2.5rem, 5vw, 4rem);
        align-items: start;
      }
      .split .section {
        padding: 0;
        border-top: 0;
        background: none;
      }
      .split .section .inner {
        max-width: none;
      }

      @media (min-width: 900px) {
        .split--narrow-left .split__inner {
          grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
        }
        .split--narrow-right .split__inner {
          grid-template-columns: minmax(0, 1fr) minmax(0, 400px);
        }
        /* the fact table gets a tighter label column in a narrow band */
        .split--narrow-left .facts {
          grid-template-columns: minmax(110px, 140px) 1fr;
        }
        .split--narrow-left .facts dt,
        .split--narrow-left .facts dd {
          padding: 0.55rem 0.75rem;
        }
        /* a pull-quote in a narrow band needs less air around it */
        .split--narrow-right blockquote.md-quote {
          padding: 1rem 1.15rem;
        }
        .split--narrow-right blockquote.md-quote p {
          font-size: 1rem;
        }
      }

      /* ---------- sections ---------- */

      section {
        scroll-margin-top: calc(var(--header-h) + var(--subnav-h));
      }
      .section {
        width: 100%;
        padding: clamp(3rem, 7vw, 4.5rem) 1.25rem;
        border-top: 1px solid var(--border);
      }
      .section--alt {
        background: var(--bg-alt);
      }
      .section h2 {
        margin: 0 0 1.25rem;
        font-size: clamp(1.3rem, 3.4vw, 1.9rem);
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .section h3 {
        margin: 2.25rem 0 0.75rem;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .section h4 {
        margin: 1.75rem 0 0.35rem;
        font-size: 0.88rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .section > .inner > :first-child,
      .section h2 + * {
        margin-top: 0;
      }
      .section p {
        max-width: 74ch;
        color: #d6d6d8;
      }
      .section hr {
        margin: 2rem 0;
        border: 0;
        border-top: 1px solid var(--border);
      }

      /* ---------- fact-sheet style lists ---------- */

      .facts {
        display: grid;
        grid-template-columns: minmax(150px, 210px) 1fr;
        gap: 0;
        margin: 0 0 1.5rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .facts dt,
      .facts dd {
        margin: 0;
        padding: 0.7rem 1rem;
        border-top: 1px solid var(--border);
      }
      .facts dt:first-of-type,
      .facts dt:first-of-type + dd {
        border-top: 0;
      }
      .facts dt {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.02);
      }
      .facts dd {
        font-size: 0.95rem;
        overflow-wrap: anywhere;
      }

      /* ---------- generic lists ---------- */

      .md-list {
        margin: 0 0 1.5rem;
        padding: 0;
        list-style: none;
        max-width: 74ch;
      }
      .md-list li {
        position: relative;
        padding: 0 0 0.65rem 1.35rem;
        color: #d6d6d8;
        font-size: 0.95rem;
      }
      .md-list li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.75rem;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
      }
      .md-list strong {
        color: var(--text);
      }

      /* features become cards */
      .section--features .md-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
        max-width: none;
      }
      .section--features .md-list li {
        padding: 1rem 1.1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        font-size: 0.92rem;
      }
      .section--features .md-list li::before {
        display: none;
      }
      .section--features .md-list strong {
        display: block;
        margin-bottom: 0.2rem;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      /* milestones become a timeline */
      .md-list--timeline {
        padding-left: 1.25rem;
        border-left: 1px solid var(--border);
      }
      .md-list--timeline li {
        padding-left: 0;
      }
      .md-list--timeline li::before {
        left: -1.62rem;
        top: 0.65rem;
        width: 9px;
        height: 9px;
        background: var(--accent);
        box-shadow: 0 0 0 3px var(--bg);
      }
      .md-list--timeline strong {
        display: inline-block;
        min-width: 8.5rem;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      /* ---------- quotes ---------- */

      blockquote.md-quote {
        margin: 0 0 1.5rem;
        padding: 1.25rem 1.5rem;
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 0 var(--radius) var(--radius) 0;
        background: var(--surface);
        max-width: 80ch;
      }
      blockquote.md-quote p {
        margin: 0;
        font-size: clamp(1rem, 2.4vw, 1.15rem);
        line-height: 1.6;
        color: #e6e6e8;
      }
      blockquote.md-quote footer {
        margin-top: 0.75rem;
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 0.04em;
      }

      /* ---------- TODO placeholders ---------- */

      .todo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 0.75rem;
        margin: 0 0 1.5rem;
      }
      .todo {
        padding: 1rem 1.15rem;
        border: 1px dashed var(--todo);
        border-radius: var(--radius);
        background: var(--todo-bg);
        color: #ecdde5;
        font-size: 0.92rem;
      }
      .todo__tag {
        display: inline-block;
        margin-bottom: 0.4rem;
        padding: 0.05rem 0.5rem;
        border-radius: 4px;
        background: var(--todo);
        color: #2a0316;
        font-size: 0.65rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .todo p {
        margin: 0;
        max-width: none;
      }
      .todo__title {
        font-weight: 700;
        color: #fff;
      }
      .todo__hint {
        margin-top: 0.2rem !important;
        color: #b9a4af !important;
        font-size: 0.85rem;
      }

      /* ---------- galleries ---------- */

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1rem;
        margin: 0 0 1.5rem;
      }
      .gallery--tight {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      }
      .card {
        margin: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        overflow: hidden;
        transition:
          border-color 0.15s ease,
          transform 0.15s ease;
      }
      .card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      .card__shot {
        display: block;
        width: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        background: #0a0a0c;
        cursor: zoom-in;
      }
      .card__shot img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #0a0a0c;
      }
      .card--contain .card__shot img {
        object-fit: contain;
        padding: 0.75rem;
        background: repeating-conic-gradient(#151518 0 25%, #1d1d21 0 50%) 50% /
          20px 20px;
      }
      .card__meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.6rem 0.85rem;
        border-top: 1px solid var(--border);
      }
      .card__name {
        min-width: 0;
        font-size: 0.8rem;
        line-height: 1.35;
      }
      .card__name b {
        display: block;
        font-weight: 600;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card__name span {
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.04em;
      }
      .card__dl {
        flex: none;
        padding: 0.25rem 0.55rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition:
          border-color 0.15s ease,
          color 0.15s ease;
      }
      .card__dl:hover,
      .card__dl:focus-visible {
        border-color: var(--accent);
        color: var(--text);
      }
      .gallery-status {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      /* ---------- video embed ---------- */

      .embed {
        position: relative;
        aspect-ratio: 16 / 9;
        max-width: 820px;
        margin: 0 0 1.25rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        background: #000;
      }
      .embed iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* ---------- lightbox ---------- */

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: clamp(1rem, 4vw, 3rem);
        background: rgba(6, 6, 8, 0.94);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      .lightbox.is-open {
        display: flex;
      }
      .lightbox img {
        max-width: 100%;
        max-height: calc(100vh - 9rem);
        object-fit: contain;
        border-radius: 6px;
      }
      .lightbox__bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 1rem;
        padding: 1rem clamp(1rem, 4vw, 3rem);
        color: var(--muted);
        font-size: 0.82rem;
      }
      .lightbox__btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: rgba(20, 20, 24, 0.85);
        color: var(--text);
        font-size: 1.2rem;
        cursor: pointer;
        transition: border-color 0.15s ease;

      .lightbox__btn--prev {

      .lightbox__btn--next {

      .footer__meta > * + *::before {

      .footer__copy {
        margin: 0;

      .footer__link {

        text-decoration: none;
        opacity: 0.8;
      }
      .footer__link:hover,
      .footer__link:focus-visible {
        opacity: 1;
        text-decoration: underline;
      }

      @media (max-width: 720px) {
        .facts {
          grid-template-columns: 1fr;
        }
        .facts dt {
          padding-bottom: 0;
        }
        .facts dt + dd {
          border-top: 0;
          padding-top: 0.15rem;

        .footer__meta > * + *::before {
          content: "";
          margin: 0 0 0 0.35rem;
        }
        .md-list--timeline strong {

      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        .card:hover,
        .btn:hover {
          transform: none;
        }
      }

    <script>
      (function () {
        "use strict";

        const KIT = "press-kit/";
        const IMAGE_RE = /\.(jpe?g|png|gif|webp|avif)$/i;
        const THUMBLESS_RE = /\.(gif|webp|avif)$/i;

        /* =====================================================
         * Small helpers
         * ===================================================== */

        function escapeHtml(text) {
          return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        function slugify(text) {
          return text
            .toLowerCase()
            .replace(/&amp;/g, "and")
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-|-$/g, "");
        }

        function formatBytes(bytes) {
          if (!bytes) return "";
          const mb = bytes / 1048576;
          return mb >= 1
            ? mb.toFixed(1) + " MB"
            : Math.round(bytes / 1024) + " KB";
        }

        function prettify(name) {
          return name
            .replace(/\.[^.]+$/, "")
            .replace(/[-_]+/g, " ")
            .replace(/\b\w/g, function (c) {
              return c.toUpperCase();
            })
            .replace(/\bBeltfed\b/g, "BELTFED")
            .replace(/\bGif\b/g, "GIF");
        }

        function inline(text) {
          return escapeHtml(text)
            .replace(/`([^`]+)`/g, "<code>$1</code>")
            .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (all, label, href) {
              const external = /^https?:/i.test(href);
              return (
                '<a href="' +
                href +
                '"' +
                (external ? ' target="_blank" rel="noopener"' : "") +
                ">" +
                label +
                "</a>"
              );
            })
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
        }

        function todoHtml(line) {
          const body = line.replace(/^TODO:\s*/, "");
          const split = body.indexOf(" - ");
          const title = split === -1 ? body : body.slice(0, split);
          const hint = split === -1 ? "" : body.slice(split + 3);
          return (
            '<div class="todo"><span class="todo__tag">TODO</span>' +
            '<p class="todo__title">' +
            inline(title) +
            "</p>" +
            (hint ? '<p class="todo__hint">' + inline(hint) + "</p>" : "") +
            "</div>"
          );
        }

        function listHtml(items, headingBefore) {
          // "- **Key:** value" pairs render as a fact-sheet definition list.
          const pairs = items.map(function (item) {
            return /^\*\*([^*]+):\*\*\s*(.*)$/.exec(item);
          });
          if (pairs.every(Boolean)) {
            return (
              '<dl class="facts">' +
              pairs
                .map(function (match) {
                  return (
                    "<dt>" +
                    inline(match[1]) +
                    "</dt><dd>" +
                    inline(match[2]) +
                    "</dd>"
                  );
                })
                .join("") +
              "</dl>"
            );
          }
          const timeline = /milestone/i.test(headingBefore || "");
          return (
            '<ul class="md-list' +
            (timeline ? " md-list--timeline" : "") +
            '">' +
            items
              .map(function (item) {
                return "<li>" + inline(item) + "</li>";
              })
              .join("") +
            "</ul>"
          );
        }

        function quoteHtml(lines) {
          const attribution = /^-\s*/.test(lines[lines.length - 1])
            ? lines.pop().replace(/^-\s*/, "")
            : "";
          return (
            '<blockquote class="md-quote"><p>' +
            inline(lines.join(" ")) +
            "</p>" +
            (attribution
              ? "<footer>- " + inline(attribution) + "</footer>"
              : "") +
            "</blockquote>"
          );
        }

        function galleryHtml(folder) {
          return '<div class="gallery" data-gallery="' + folder + '"></div>';
        }

        function youtubeHtml(id) {
          return (
            '<div class="embed"><iframe src="https://www.youtube-nocookie.com/embed/' +
            id +
            '?rel=0" title="BELTFED video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>'
          );
        }

        function parseMarkdown(source) {
          // Pull the markers out before comments are stripped.
          const markers = [];
          let text = source
            .replace(/\r\n?/g, "\n")
            .replace(
              /<!--\s*(gallery|youtube)\s*:\s*([^\s>]+)\s*-->/g,
              function (all, kind, value) {
                markers.push({ kind: kind, value: value });
                return "\n@@M" + (markers.length - 1) + "@@\n";
              },
            )
            .replace(/<!--[\s\S]*?-->/g, "");

          const lines = text.split("\n");
          const sections = [];
          let current = null;
          let lastHeading = "";

          function push(html) {
            if (!current) return;
            current.html += html;
          }

          let i = 0;
          while (i < lines.length) {
            const line = lines[i];
            const trimmed = line.trim();

            if (!trimmed) {
              i += 1;
              continue;
            }

            const marker = /^@@M(\d+)@@$/.exec(trimmed);
            if (marker) {
              const entry = markers[Number(marker[1])];
              push(
                entry.kind === "gallery"
                  ? galleryHtml(entry.value)
                  : youtubeHtml(entry.value),
              );
              i += 1;
              continue;
            }

            const heading = /^(#{1,6})\s+(.*)$/.exec(trimmed);
            if (heading) {
              const level = heading[1].length;
              const title = heading[2].trim();
              lastHeading = title;
              if (level <= 2) {
                // h1 is the document title (the hero covers it); h2 starts a section.
                if (level === 2) {
                  current = {
                    title: title,
                    id: slugify(escapeHtml(title)),
                    html: "",
                  };
                  sections.push(current);
                } else {
                  current = null;
                }
              } else {
                push("<h" + level + ">" + inline(title) + "</h" + level + ">");
              }
              i += 1;
              continue;
            }

            if (/^(-{3,}|\*{3,})$/.test(trimmed)) {
              push("<hr />");
              i += 1;
              continue;
            }

            if (/^[-*]\s+/.test(trimmed)) {
              const items = [];
              while (i < lines.length && /^[-*]\s+/.test(lines[i].trim())) {
                items.push(lines[i].trim().replace(/^[-*]\s+/, ""));
                i += 1;
              }
              push(listHtml(items, lastHeading));
              continue;
            }

            if (/^>/.test(trimmed)) {
              const quoted = [];
              while (i < lines.length && /^>/.test(lines[i].trim())) {
                quoted.push(lines[i].trim().replace(/^>\s?/, ""));
                i += 1;
              }
              push(quoteHtml(quoted));
              continue;
            }

            // Paragraph, or a run of TODO lines.
            const block = [];
            while (
              i < lines.length &&
              lines[i].trim() &&
              !/^(#{1,6}\s|[-*]\s|>|@@M\d+@@|-{3,}$)/.test(lines[i].trim())
            ) {
              block.push(lines[i].trim());
              i += 1;
            }
            if (/^TODO:/.test(block[0])) {
              push(
                '<div class="todo-grid">' +
                  block
                    .filter(function (entry) {
                      return /^TODO:/.test(entry);
                    })
                    .map(todoHtml)
                    .join("") +
                  "</div>",
              );
            } else {
              push("<p>" + inline(block.join(" ")) + "</p>");
            }
          }

          return sections;
        }

        /* =====================================================
         * Galleries - listed live from press-kit/[folder]/
         * ===================================================== */

        // thumb: which extension make-thumbs.py usually produces for this
        // folder - it writes PNG only for images that really use transparency,
        // JPEG for everything else. Guessing right just avoids a wasted request;
        // the other extension and then the original are still tried after it.
        const GALLERY_OPTS = {
          screenshots: { contain: false, tight: false, thumb: "jpg" },
          gifs: { contain: false, tight: false, thumb: "jpg" },
          logos: { contain: true, tight: true, thumb: "png" },
          "key-art": { contain: true, tight: true, thumb: "jpg" },
          team: { contain: true, tight: true, thumb: "jpg" },
        };

        // Nicer labels than the filename for the assets we ship today. Anything
        // not listed falls back to a prettified filename, so new drops still
        // look tidy without touching this file.
        const LABELS = {
          "beltfed-key-art.jpg": "Key art - 8000×4000",
          "beltfed-logo-color.png": "BELTFED logo - color, transparent",
          "hello-world-studios-logo.png": "Hello World Studios logo - color",
          "icon-app.png": "App icon - 184×184",
          "icon-shortcut.png": "Shortcut icon - 256×256",
          "header-capsule.png": "Header capsule - 920×439",
          "main-capsule.png": "Main capsule - 1232×706",
          "small-capsule-a.png": "Small capsule A - 462×174",
          "small-capsule-b.png": "Small capsule B - 462×174",
          "vertical-capsule.png": "Vertical capsule - 748×896",
          "library-hero.png": "Library hero - 3840×1240",
          "library-logo.png": "Library logo - 1280×720",
          "page-background.png": "Page background - 1438×810",
          "bundle-assets.png": "Bundle asset - 707×232",
          "toby-atkinson.jpg": "Toby Atkinson - press photo",
          "troy-atkinson.jpg": "Troy Atkinson - press photo",
        };

        // Used when the GitHub API is unavailable (rate limited, offline,
        // opened from file://). Regenerated content still lists fine from the
        // API; this is only a floor.
        const FALLBACK = {
          screenshots: [
            "beltfed-screenshot-01.jpg",
            "beltfed-screenshot-02.jpg",
            "beltfed-screenshot-03.jpg",
            "beltfed-screenshot-04.jpg",
            "beltfed-screenshot-05.jpg",
            "beltfed-screenshot-06.jpg",
            "beltfed-screenshot-07.jpg",
            "beltfed-screenshot-08.jpg",
            "beltfed-screenshot-09.jpg",
            "beltfed-screenshot-10.jpg",
            "beltfed-screenshot-11.jpg",
            "beltfed-screenshot-12.jpg",
            "beltfed-screenshot-13.jpg",
            "beltfed-screenshot-14.jpg",
            "beltfed-screenshot-15.jpg",
            "beltfed-screenshot-16.jpg",
          ],
          gifs: [],
          logos: [
            "beltfed-logo-color.png",
            "hello-world-studios-logo.png",
            "icon-app.png",
            "icon-shortcut.png",
          ],
          "key-art": [
            "beltfed-key-art.jpg",
            "bundle-assets.png",
            "header-capsule.png",
            "library-hero.png",
            "library-logo.png",
            "main-capsule.png",
            "page-background.png",
            "small-capsule-a.png",
            "small-capsule-b.png",
            "vertical-capsule.png",
          ],
          team: ["toby-atkinson.jpg", "troy-atkinson.jpg"],
        };

        function listFolder(folder) {
          const url =
            "https://api.github.com/repos/" +
            CONFIG.repo +
            "/contents/press/press-kit/" +
            folder +
            "?ref=" +
            CONFIG.branch;
          return fetch(url, {
            headers: { Accept: "application/vnd.github+json" },
          })
            .then(function (res) {
              if (!res.ok) throw new Error("HTTP " + res.status);
              return res.json();
            })
            .then(function (body) {
              if (!Array.isArray(body)) throw new Error("unexpected payload");
              return body
                .filter(function (entry) {
                  return entry.type === "file" && IMAGE_RE.test(entry.name);
                })
                .map(function (entry) {
                  return { name: entry.name, size: entry.size };
                })
                .sort(function (a, b) {
                  return a.name.localeCompare(b.name, "en", { numeric: true });
                });
            })
            .catch(function () {
              return (FALLBACK[folder] || []).map(function (name) {
                return { name: name, size: 0 };
              });
            });
        }

        // Thumbnails live outside press-kit/ so the ZIP stays clean, and they are
        // optional: fall back to the original if one hasn't been generated yet.
        function sourceChain(folder, name) {
          const original = KIT + folder + "/" + name;
          if (THUMBLESS_RE.test(name)) return [original];
          const stem = name.replace(/\.[^.]+$/, "");
          const first = (GALLERY_OPTS[folder] || {}).thumb === "png"
            ? "png"
            : "jpg";
          const second = first === "png" ? "jpg" : "png";
          return [
            "thumbs/" + folder + "/" + stem + "." + first,
            "thumbs/" + folder + "/" + stem + "." + second,
            original,
          ];
        }

        function applyChain(img, chain) {
          let step = 0;
          img.onerror = function () {
            step += 1;
            if (step < chain.length) img.src = chain[step];
          };
          img.src = chain[0];
        }

        const lightboxSets = {};

        function renderGallery(node) {
          const folder = node.dataset.gallery;
          const opts = GALLERY_OPTS[folder] || { contain: false, tight: false };
          if (opts.tight) node.classList.add("gallery--tight");

          node.innerHTML =
            '<p class="gallery-status">Loading ' + folder + "…</p>";

          listFolder(folder).then(function (files) {
            node.innerHTML = "";
            if (!files.length) {
              node.hidden = true;
              return;
            }

            const set = [];
            files.forEach(function (file, index) {
              const original = KIT + folder + "/" + file.name;
              const label = LABELS[file.name] || prettify(file.name);
              set.push({ src: original, label: label, name: file.name });

              const card = document.createElement("figure");
              card.className = "card" + (opts.contain ? " card--contain" : "");

              const trigger = document.createElement("button");
              trigger.type = "button";
              trigger.className = "card__shot";
              trigger.setAttribute("aria-label", "View " + label);
              trigger.addEventListener("click", function () {
                openLightbox(folder, index);
              });

              const img = document.createElement("img");
              img.alt = label;
              img.loading = "lazy";
              img.decoding = "async";
              applyChain(img, sourceChain(folder, file.name));
              trigger.appendChild(img);

              const meta = document.createElement("figcaption");
              meta.className = "card__meta";

              const nameEl = document.createElement("div");
              nameEl.className = "card__name";
              const bold = document.createElement("b");
              bold.textContent = label;
              const sub = document.createElement("span");
              sub.textContent =
                file.name + (file.size ? " · " + formatBytes(file.size) : "");
              nameEl.appendChild(bold);
              nameEl.appendChild(sub);

              const dl = document.createElement("a");
              dl.className = "card__dl";
              dl.href = original;
              dl.setAttribute("download", "");
              dl.textContent = "Get";

              meta.appendChild(nameEl);
              meta.appendChild(dl);
              card.appendChild(trigger);
              card.appendChild(meta);
              node.appendChild(card);
            });

            lightboxSets[folder] = set;
          });
        }

        /* =====================================================
         * Lightbox
         * ===================================================== */

        const lb = document.getElementById("lightbox");
        const lbImg = document.getElementById("lightbox-img");
        const lbCaption = lb.querySelector('[data-lb="caption"]');
        const lbDownload = lb.querySelector('[data-lb="download"]');
        let current = { folder: null, index: 0 };

        function showCurrent() {
          const set = lightboxSets[current.folder];
          const item = set[current.index];
          // Show the cached thumbnail immediately, then swap in the original.
          applyChain(lbImg, sourceChain(current.folder, item.name));
          const full = new Image();
          full.onload = function () {
            if (lb.classList.contains("is-open")) {
              lbImg.onerror = null;
              lbImg.src = item.src;
            }
          };
          full.src = item.src;
          lbImg.alt = item.label;
          lbCaption.textContent =
            item.label + "  ·  " + (current.index + 1) + " / " + set.length;
          lbDownload.href = item.src;
        }

        function openLightbox(folder, index) {
          const set = lightboxSets[folder];
          if (!set || !set.length) return;
          current = { folder: folder, index: index };
          showCurrent();
          lb.classList.add("is-open");
          document.body.style.overflow = "hidden";
        }

        function stepBy(delta) {
          const set = lightboxSets[current.folder];
          if (!set) return;
          current.index = (current.index + delta + set.length) % set.length;
          showCurrent();
        }

        function closeLightbox() {
          lb.classList.remove("is-open");
          lbImg.src = "";
          document.body.style.overflow = "";
        }

        lb.addEventListener("click", function (event) {
          const action = event.target.closest("[data-lb]");
          if (action) {
            if (action.dataset.lb === "close") closeLightbox();
            if (action.dataset.lb === "prev") stepBy(-1);
            if (action.dataset.lb === "next") stepBy(1);
            return;
          }
          if (event.target === lb) closeLightbox();
        });

        document.addEventListener("keydown", function (event) {
          if (!lb.classList.contains("is-open")) return;
          if (event.key === "Escape") closeLightbox();
          if (event.key === "ArrowLeft") stepBy(-1);
          if (event.key === "ArrowRight") stepBy(1);
        });

        /* =====================================================
         * Boot
         * ===================================================== */

        // Section pairs that share one band on wide screens, and which of the
        // two is the narrow column. The narrow one is the aside: it keeps its
        // own id and anchor but is left out of the nav.
        const SPLITS = [
          { left: "fact-sheet", right: "description", narrow: "left" },
          { left: "team", right: "quotes", narrow: "right" },
        ];

        const content = document.getElementById("content");
        const subnav = document.getElementById("subnav");

        document.querySelectorAll("[data-zip]").forEach(function (el) {
          el.href = CONFIG.zip;
          el.setAttribute("download", CONFIG.zipDownloadName);
        });

        document.querySelectorAll("[data-drive]").forEach(function (el) {
          el.href = CONFIG.drive;
        });

        if (CONFIG.videos) {
          document.querySelectorAll("[data-videos]").forEach(function (el) {
            el.href = CONFIG.videos;
            el.target = "_blank";
            el.rel = "noopener";
          });
        }

        document.getElementById("year").textContent = new Date().getFullYear();

        fetch(CONFIG.zip, { method: "HEAD" })
          .then(function (res) {
            const size = res.headers.get("content-length");
            if (!size) return;
            document.querySelectorAll("[data-zip-size]").forEach(function (el) {
              el.textContent = "(" + formatBytes(Number(size)) + ")";
            });
          })
          .catch(function () {});

        fetch(CONFIG.markdown, { cache: "no-cache" })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
          })
          .then(function (source) {
            const sections = parseMarkdown(source);

            // Rows of the page: usually one section, but a listed pair is
            // rendered as two columns of one band. Background alternation runs
            // over rows, not sections, so a pair still counts as one stripe.
            const rows = [];
            for (let i = 0; i < sections.length; i += 1) {
              const pair = SPLITS.find(function (split) {
                return (
                  split.left === sections[i].id &&
                  sections[i + 1] &&
                  sections[i + 1].id === split.right
                );
              });
              if (pair) {
                rows.push({
                  split: pair,
                  items: [sections[i], sections[i + 1]],
                });
                i += 1;
              } else {
                rows.push({ split: null, items: [sections[i]] });
              }
            }

            function buildSection(section) {
              const el = document.createElement("section");
              el.id = section.id;
              el.className = "section section--" + section.id;
              el.innerHTML =
                '<div class="inner"><h2>' +
                escapeHtml(section.title) +
                "</h2>" +
                section.html +
                "</div>";
              return el;
            }

            const rowOf = {};
            rows.forEach(function (row, index) {
              const alt = index % 2 ? " section--alt" : "";
              if (row.split) {
                const band = document.createElement("div");
                band.className =
                  "split split--narrow-" + row.split.narrow + " section" + alt;
                const grid = document.createElement("div");
                grid.className = "split__inner";
                row.items.forEach(function (section) {
                  grid.appendChild(buildSection(section));
                });
                band.appendChild(grid);
                content.appendChild(band);
              } else {
                const el = buildSection(row.items[0]);
                el.className += alt;
                content.appendChild(el);
              }

              row.items.forEach(function (section) {
                rowOf[section.id] = index;
                // In a side-by-side band only the wide column gets a nav chip.
                // Both halves scroll to the same place, so a chip for the narrow
                // one would only ever light up alongside its partner.
                if (row.split && section.id === row.split[row.split.narrow]) {
                  return;
                }
                const link = document.createElement("a");
                link.href = "#" + section.id;
                link.textContent = section.title;
                subnav.appendChild(link);
              });
            });

            content.querySelectorAll("[data-gallery]").forEach(renderGallery);

            const links = Array.prototype.slice.call(
              subnav.querySelectorAll("a"),
            );
            const spy = new IntersectionObserver(
              function (entries) {
                entries.forEach(function (entry) {
                  if (!entry.isIntersecting) return;
                  // Both halves of a side-by-side band scroll to the same place,
                  // so light up both of their nav chips rather than flickering.
                  const row = rowOf[entry.target.id];
                  links.forEach(function (link) {
                    link.classList.toggle(
                      "is-active",
                      rowOf[link.getAttribute("href").slice(1)] === row,
                    );
                  });
                });
              },
              { rootMargin: "-30% 0px -60% 0px" },
            );
            sections.forEach(function (section) {
              const el = document.getElementById(section.id);
              if (el) spy.observe(el);
            });

            if (location.hash) {
              const target = document.querySelector(location.hash);
              if (target) target.scrollIntoView();
            }
          })
          .catch(function () {
            content.innerHTML =
              '<section class="section"><div class="inner">' +
              "<h2>Press kit</h2>" +
              "<p>The press kit text could not be loaded. Read it directly at " +
              '<a href="' +
              CONFIG.markdown +
              '">' +
              CONFIG.markdown +
              "</a>, or download the full kit.</p>" +
              '<p><a class="btn btn-primary" href="' +
              CONFIG.zip +
              '" download="' +
              CONFIG.zipDownloadName +
              '">Download press kit</a></p>' +
              "</div></section>";
          });
      })();
    </script>
  </body>
</html>
